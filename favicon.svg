<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Dark container with cyan/blue gradient border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="2.5"/>

  <!-- Terminal chevron prompt in top-left -->
  <path d="M 9 10 L 13 14 L 9 18" stroke="#06b6d4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.75"/>

  <!-- Monogram D (Vibrant Cyan) -->
  <path fill="url(#cyanGrad)" fill-rule="evenodd" d="M 14 17 H 24.5 C 29.8 17 33 21 33 32 C 33 43 29.8 47 24.5 47 H 14 Z M 20.5 23 V 41 H 23.8 C 26.5 41 27.5 37.8 27.5 32 C 27.5 26.2 26.5 23 23.8 23 Z"/>

  <!-- Monogram B (Crisp White) -->
  <path fill="#ffffff" fill-rule="evenodd" d="M 35 17 H 44 C 47.6 17 49.8 19.5 49.8 23.8 C 49.8 27.2 47.8 29.5 44.8 30.5 C 48.2 31.5 50.5 34.5 50.5 39.2 C 50.5 44.5 47.6 47 43 47 H 35 Z M 41.2 22.8 V 28.5 H 43.6 C 45 28.5 45.8 27.2 45.8 25.6 C 45.8 24 45 22.8 43.6 22.8 Z M 41.2 34.5 V 41.2 H 43.8 C 45.5 41.2 46.5 39.8 46.5 37.8 C 46.5 35.8 45.5 34.5 43.8 34.5 Z"/>

  <!-- Live Status Dot (emerald green) -->
  <circle cx="52" cy="12" r="3.2" fill="#10b981"/>
  <circle cx="52" cy="12" r="4.8" fill="#10b981" opacity="0.3"/>
</svg>